groups:
  - name: flask-app-alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{http_status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) * 100 > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP Error Rate detected"
          description: "The 5xx error rate on the Flask application is above 5% (current value is reporting high failures)."